async function interessePacote(nomePacote, preco){
  const nome = prompt("Digite seu nome completo!:");

  if(!nome) return alert("👤 Nome obrigatório!");

  // 🔥 SALVA NO FIREBASE
  await db.collection("assinaturas").add({
    nome: nome,
    pacote: nomePacote,
    preco: preco || 0,
    validade: "2026-05-10",
    usos: 0,
    status: "pendente",
    data: new Date().toISOString()
  });

  // 🔥 MENSAGEM WHATSAPP
  const msg = `🔥 *ASSINATURA DE PACOTE*\n\n` +
              `👤 Nome: ${nome}\n` +
              `📦 Pacote: ${nomePacote}\n` +
              `💰 Valor: R$ ${preco}\n\n` +
              `📲 Envie o comprovante do PIX para confirmar.`;

  window.open(`https://wa.me/5521999999999?text=${encodeURIComponent(msg)}`, '_blank');           // ALTERE AQUI TBM

  alert("✅ Pedido enviado! Envie o comprovante no WhatsApp.PIX:xxxx-xxxx");
}
async function verificarAssinatura(nomeCliente){
  const snapshot = await db.collection("assinaturas")
    .where("nome", "==", nomeCliente)
    .get();

  if(snapshot.empty) return false;

  let valido = false;

  snapshot.forEach(doc => {
    const a = doc.data();

    if(a.status === "pago" && a.validade){
      const hoje = new Date();
      const validade = new Date(a.validade);

      if(validade >= hoje){
        valido = true;
      }
    }
  });

  return valido;
}
async function verificarLimite(nomeCliente){
  const snapshot = await db.collection("assinaturas")
    .where("nome", "==", nomeCliente)
    .get();

  if(snapshot.empty) return { permitido:false };

  let permitido = false;
  let docRef = null;

  for(const doc of snapshot.docs){
    const a = doc.data();

    if(a.status === "pago"){
      const pacoteDoc = await db.collection("pacotes")
        .where("nome", "==", a.pacote)
        .get();

      if(!pacoteDoc.empty){
        const pacote = pacoteDoc.docs[0].data();
        const limite = pacote.limite || 0;
        const usos = a.usos || 0;

        if(usos < limite){
          permitido = true;
          docRef = doc.ref;
        }
      }
    }
  }

  return { permitido, docRef };
}

function formatarDataLocal(data) {
  const ano = data.getFullYear();
  const mes = String(data.getMonth() + 1).padStart(2, '0');
  const dia = String(data.getDate()).padStart(2, '0');
  return `${ano}-${mes}-${dia}`;
}

function mostrarTela(telaId) {
  const telas = ["profissionais","horarios","servicos", "resumo"];

      if(id !== telaId) el.innerHTML = el.innerHTML; // limpa bugs visuais
    }
  });
}

function gerarCalendario() {
  const div = document.getElementById("calendario");
  div.innerHTML = "";
  const hoje = new Date();
  
  for(let i = 0; i < 7; i++) {
    const d = new Date();
    d.setDate(hoje.getDate() + i);
    const dataISO = formatarDataLocal(d);
    
    const estaFechado = Array.isArray(diasFechados) && diasFechados.includes(dataISO);
    
    const btn = document.createElement("div");
    btn.className = `dia ${estaFechado ? 'fechado' : ''}`;
    btn.innerHTML = `
      <strong>${d.getDate()}</strong><br>
      <small>${d.toLocaleDateString("pt-BR",{weekday:"short"})}</small>
      ${estaFechado ? '<br><small style="color:#e74c3c">FECHADO</small>' : ''}
    `;
    
    if(!estaFechado) {
      btn.onclick = () => {
        dataSelecionada = dataISO;
        document.querySelectorAll(".dia").forEach(el => el.classList.remove("ativo"));
        btn.classList.add("ativo");
        document.getElementById("dataEscolhida").innerText = d.toLocaleDateString("pt-BR", {
          weekday: "long", day: "numeric", month: "long"
        });
        if(profissional && nomeServico){
          escolherProfissional(profissional);
        }
      };
    }
    
    div.appendChild(btn);
  }
}

    btn.innerText = categoria;
    btn.onclick = () => mostrarServicosDaCategoria(categoria);
    categoriasDiv.appendChild(btn);
  });
}
function mostrarServicosDaCategoria(categoria) {
  const div = document.getElementById("listaServicosCategoria");
  const servicos = categoriasServicos[categoria];
  document.querySelectorAll(".categoria-btn").forEach(btn => {
    btn.classList.toggle("ativa", btn.innerText === categoria);
  });

  div.innerHTML = `
    <div class="categoria-atual">
      <span>Categoria selecionada</span>
      <strong>${categoria}</strong>
    </div>
  `;

  Object.entries(servicos).forEach(([nome, preco]) => {
    const selecionado = servicosSelecionados.some(s => s.nome === nome);

    const btn = document.createElement("button");
    btn.className = selecionado ? "opcao servico-ativo" : "opcao";
    btn.innerText = `${nome} - R$ ${preco}`;
    btn.onclick = () => alternarServico(nome, preco, categoria);

    div.appendChild(btn);
  });
}

function alternarServico(nome, preco, categoriaAtual) {
  const index = servicosSelecionados.findIndex(s => s.nome === nome);

  if (index >= 0) {
    servicosSelecionados.splice(index, 1);
  } else {
    if (servicosSelecionados.length >= 4) {
      return alert("Você pode selecionar no máximo 4 serviços.");
    }

    servicosSelecionados.push({
      nome,
      preco
    });
  }

  valorTotalServicos = servicosSelecionados.reduce((total, s) => total + s.preco, 0);
  nomeServico = servicosSelecionados.map(s => s.nome).join(" + ");

  atualizarResumoServicosSelecionados();
  mostrarServicosDaCategoria(categoriaAtual);
}

function atualizarResumoServicosSelecionados() {
  const box = document.getElementById("servicosSelecionadosBox");
  const btnContinuar = document.getElementById("btnContinuarServico");

  if (servicosSelecionados.length === 0) {
    box.style.display = "none";
    btnContinuar.style.display = "none";
    return;
  }

  box.style.display = "block";
  btnContinuar.style.display = "block";

  box.innerHTML = `
    <div style="background:#111; border:1px solid #A67360; border-radius:12px; padding:12px;">
      <strong>Selecionados (${servicosSelecionados.length}/4):</strong><br>
      ${servicosSelecionados.map(s => `• ${s.nome} - R$ ${s.preco}`).join("<br>")}
      <br><br>
      <strong style="color:#25D366;">Total: R$ ${valorTotalServicos}</strong>
    </div>
  `;
}

// busca do documento config/horariosExtras
  const extrasHoje =
    horariosExtras?.[p]?.[dataSelecionada] || [];

  // junta fixos + extras
  const todosHorarios = [...new Set([
    ...horariosFixos,

  const horariosOcupados = agenda[dataSelecionada]?.[p] || [];
  const bloqueados = (bloqueios?.[dataSelecionada]?.[p]) || []; 
  const diaTrancado = bloqueados.includes("__DIA_TRANCADO__");

    </button>
  `;

}
     
  todosHorarios.forEach(h => {

 // 🔥 horário passado some
  if (passou) {
    return;
  }

  const btn = document.createElement("div");

  // 🔥 horário ocupado continua aparecendo
  if (ocupado) {
    btn.className = "horario-btn ocupado";

  }

  // 🔥 horário bloqueado continua aparecendo
  else if (bloqueado) {
    btn.className = "horario-btn bloqueado";
    btn.innerHTML = `<span>🔒 ${h}</span>`;
  }

  // 🔥 horário disponível
  else {
    btn.className = "horario-btn";
    btn.innerHTML = `<span style="color:#25D366">✅ ${h}</span>`;

async function confirmarAgendamento() {
  const nome = document.getElementById("nomeCliente").value.trim();
  if(!nome) return alert("👤 Digite seu nome completo!");
  const telefone = document.getElementById("telefoneCliente").value.trim();

  if(!telefone){
    return alert("📱 Informe seu WhatsApp!");
  }

  let usarPacote = false;
  let docRef = null;

  // 🔥 TENTA BUSCAR ASSINATURA (MAS NÃO OBRIGA)
  const snap = await db.collection("assinaturas")
    .where("nome", "==", nome)
    .get();

  if(!snap.empty){
    const assinatura = snap.docs[0].data();

    // 🔥 SE TEM ASSINATURA PAGA → VERIFICA LIMITE
    if(assinatura.status === "pago"){
      const pacoteSnap = await db.collection("pacotes")
        .where("nome", "==", assinatura.pacote)
        .get();

      if(!pacoteSnap.empty){
        const pacote = pacoteSnap.docs[0].data();

        const limite = pacote.limite || 0;
        const usos = assinatura.usos || 0;

        if(usos < limite){
          usarPacote = true;
          docRef = snap.docs[0].ref;
        } else {
          alert(" Seu pacote acabou, mas você pode agendar normalmente.");
        }
      }
    }
  }

  // 🔥 SALVAR AGENDAMENTO (LIBERADO PRA TODOS)
  const ref = db.collection("agenda").doc(dataSelecionada);
  const doc = await ref.get();
  
  let dados = doc.exists ? doc.data() : {};

  if(!dados[profissional]) dados[profissional] = [];

  const jaExiste = dados[profissional].some(x => (x.horario || x) === horario);

  if(jaExiste){
    return alert(" Esse horário acabou de ser ocupado!");
  }

  dados[profissional].push({
    horario: horario,
    nome: nome,
    telefone,
    servicos: nomeServico,
    valorTotal: valorTotalServicos,
    servicosLista: servicosSelecionados,
    lembreteEnviado: false
  });

  await ref.set(dados);

  // 🔥 SÓ DESCONTA SE USOU PACOTE
  if(usarPacote && docRef){
    await docRef.update({
      usos: firebase.firestore.FieldValue.increment(1)
    });
  }
